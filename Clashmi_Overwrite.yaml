# ███████████████████████████ 锚点区域 ███████████████████████████

# ══ 出站锚点（默认走代理的服务） ══
Anchor_OP: &Anchor_OP
  type: select
  proxies: [一键代理, 香港-故转, 台湾-故转, 日本-故转, 新加坡-故转, 韩国-故转, 美国-故转, 欧洲-故转,
            香港-自动, 台湾-自动, 日本-自动, 新加坡-自动, 韩国-自动, 美国-自动, 欧洲-自动,
            香港-手动, 台湾-手动, 日本-手动, 新加坡-手动, 韩国-手动, 美国-手动, 欧洲-手动, 其他-手动,
            国内直连]

# ══ 出站锚点（默认直连、可切换代理的服务） ══
Anchor_LD: &Anchor_LD
  type: select
  proxies: [国内直连, 一键代理, 香港-故转, 台湾-故转, 日本-故转, 新加坡-故转, 韩国-故转, 美国-故转, 欧洲-故转,
            香港-自动, 台湾-自动, 日本-自动, 新加坡-自动, 韩国-自动, 美国-自动, 欧洲-自动,
            香港-手动, 台湾-手动, 日本-手动, 新加坡-手动, 韩国-手动, 美国-手动, 欧洲-手动, 其他-手动]

# ══ 出站锚点（主选择组，含所有区域） ══
Anchor_PG: &Anchor_PG
  type: select
  proxies: [香港-故转, 台湾-故转, 日本-故转, 新加坡-故转, 韩国-故转, 美国-故转, 欧洲-故转,
            香港-自动, 台湾-自动, 日本-自动, 新加坡-自动, 韩国-自动, 美国-自动, 欧洲-自动,
            香港-手动, 台湾-手动, 日本-手动, 新加坡-手动, 韩国-手动, 美国-手动, 欧洲-手动, 其他-手动,
            国内直连]

# ══ 直连锚点（隐藏，仅 DIRECT） ══
Anchor_DR: &Anchor_DR
  type: select
  proxies: [DIRECT]
  hidden: true

# ══ 手动选节点组锚点 ══
Anchor_HS: &Anchor_HS
  type: select
  include-all: true

# ══ 故障转移组锚点 ══
Anchor_FB: &Anchor_FB
  type: fallback
  url: 'https://www.g.cn/generate_204'
  interval: 300
  lazy: false
  timeout: 2000
  max-failed-times: 3
  hidden: true

# ══ 自动测速组锚点 ══
Anchor_UT: &Anchor_UT
  type: url-test
  url: 'https://www.g.cn/generate_204'
  interval: 300
  lazy: false
  tolerance: 50
  timeout: 2000
  max-failed-times: 3
  hidden: true
  include-all: true

# ══ 规则集锚点 ══
Anchor_DN: &Anchor_DN {type: http, interval: 86400, behavior: domain, format: mrs}
Anchor_IP: &Anchor_IP {type: http, interval: 86400, behavior: ipcidr, format: mrs}
Anchor_CL: &Anchor_CL {type: http, interval: 86400, behavior: classical, format: yaml}

# ══ 地区正则锚点（混合风格：emoji + 中文 + 英文缩写 + 机场代码） ══
Anchor_HK: &Anchor_HK '^(?i)(?=.*(香港|🇭🇰|\bHK\b|HKG|Hong(?:\s?Kong)?)).*$'
Anchor_TW: &Anchor_TW '^(?i)(?=.*(台湾|台灣|🇹🇼|\bTW\b|\bTPE\b|\bTSA\b|\bKHH\b|Taiwan|Taipei)).*$'
Anchor_JP: &Anchor_JP '^(?i)(?=.*(日本|🇯🇵|\bJP\b|Japan|Tokyo|Osaka|NRT|HND|KIX|CTS|FUK|大阪|东京)).*$'
Anchor_KR: &Anchor_KR '^(?i)(?=.*(韩国|韓國|🇰🇷|首尔|首爾|\bKR\b|\bKOR\b|Korea|Seoul)).*$'
Anchor_SG: &Anchor_SG '^(?i)(?=.*(新加坡|狮城|🇸🇬|\bSG\b|Singapore|SIN|XSP)).*$'
Anchor_US: &Anchor_US '^(?i)(?=.*(美国|美國|🇺🇸|\bUS\b|\bUSA\b|America|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|洛杉矶|纽约|西雅图)).*$'
Anchor_EU: &Anchor_EU '^(?i)(?=.*(英国|德国|法国|荷兰|意大利|西班牙|瑞典|波兰|葡萄牙|比利时|爱尔兰|捷克|丹麦|芬兰|🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇮🇹|🇪🇸|🇸🇪|🇵🇱|🇧🇪|🇮🇪|🇨🇿|🇩🇰|🇫🇮|LHR|LGW|FRA|CDG|AMS|MAD|FCO|MUC|BRU)).*$'
Anchor_OT: &Anchor_OT '^(?!.*(DIRECT|直连|香港|台湾|台灣|日本|韩国|韓國|新加坡|狮城|美国|美國|英国|德国|法国|荷兰|意大利|西班牙|🇭🇰|🇹🇼|🇯🇵|🇰🇷|🇸🇬|🇺🇸|🇬🇧|🇩🇪|🇫🇷|🇳🇱|HK|TW|JP|KR|SG|US|HKG|TPE|NRT|SIN|LAX|JFK|LHR|FRA|CDG)).*$'



# ███████████████████████████ 核心配置 ███████████████████████████

mode: rule                        # 工作模式
ipv6: true                        # 启用 IPv6
mixed-port: 7893                  # HTTP + SOCKS5 混合端口
allow-lan: true                   # 允许局域网连接
bind-address: "*"                 # 监听所有接口
log-level: warning                # 日志级别
unified-delay: true               # 统一延迟，减少抖动
tcp-concurrent: true              # TCP 并发，提升多任务性能
profile:
  store-selected: true            # 记住选择的策略组
  store-fake-ip: true             # 记住 Fake-IP 映射

# ══ 管理面板 ══
external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: ""                        # 建议设置密码

# ══ TUN 配置 ══
tun:
  enable: true
  stack: mixed                    # mixed = TCP用system，UDP用gvisor，兼容性最佳
  dns-hijack: [any:53, tcp://any:53]
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: false             # false 兼容性更好，有问题再改 true
  endpoint-independent-nat: true  # 提升 P2P / 游戏 NAT 兼容性
  mtu: 1500

# ══ 流量嗅探 ══
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    QUIC: {ports: [443]}
    TLS:  {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
    - "+.tiktok.com"
    - "+.tiktokcdn.com"
    - "+.googlevideo.com"
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"
    - "+.lan"
    - "+.local"

# ══ DNS 配置 ══
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: false
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.arpa'
    - 'localhost'
    - "rule-set:cn_domain"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114



# ███████████████████████████ 策略分组 ███████████████████████████

proxy-groups:

  # ══ 主入口 ══
  - {name: 一键代理,    <<: *Anchor_PG}

  # ══ 代理服务（默认走代理） ══
  - {name: ChatGPT,    <<: *Anchor_OP}
  - {name: Claude,     <<: *Anchor_OP}
  - {name: Gemini,     <<: *Anchor_OP}
  - {name: YouTube,    <<: *Anchor_OP}
  - {name: Google,     <<: *Anchor_OP}
  - {name: GitHub,     <<: *Anchor_OP}
  - {name: TikTok,     <<: *Anchor_OP}
  - {name: 抖音,        <<: *Anchor_OP}
  - {name: Telegram,   <<: *Anchor_OP}
  - {name: Twitter,    <<: *Anchor_OP}
  - {name: Netflix,    <<: *Anchor_OP}
  - {name: Disney,     <<: *Anchor_OP}
  - {name: Spotify,    <<: *Anchor_OP}
  - {name: PayPal,     <<: *Anchor_OP}
  - {name: Speedtest,  <<: *Anchor_OP}
  - {name: 漏网之鱼,    <<: *Anchor_OP}

  # ══ 国内服务（默认直连，可切换） ══
  - {name: 微软服务,    <<: *Anchor_LD}
  - {name: 苹果服务,    <<: *Anchor_OP}   # 默认代理，Apple Intelligence 需要美国节点
  - {name: 哔哩哔哩,    <<: *Anchor_LD}
  - {name: 小红书,      <<: *Anchor_LD}
  - {name: 阿里腾讯,    <<: *Anchor_LD}

  # ══ 直连（隐藏） ══
  - {name: 国内直连,    <<: *Anchor_DR}

  # ══ 故障转移组（隐藏，自动切换手动↔自动） ══
  - {name: 香港-故转,   <<: *Anchor_FB, proxies: [香港-手动, 香港-自动]}
  - {name: 台湾-故转,   <<: *Anchor_FB, proxies: [台湾-手动, 台湾-自动]}
  - {name: 日本-故转,   <<: *Anchor_FB, proxies: [日本-手动, 日本-自动]}
  - {name: 新加坡-故转, <<: *Anchor_FB, proxies: [新加坡-手动, 新加坡-自动]}
  - {name: 韩国-故转,   <<: *Anchor_FB, proxies: [韩国-手动, 韩国-自动]}
  - {name: 美国-故转,   <<: *Anchor_FB, proxies: [美国-手动, 美国-自动]}
  - {name: 欧洲-故转,   <<: *Anchor_FB, proxies: [欧洲-手动, 欧洲-自动]}

  # ══ 手动选节点组（隐藏） ══
  - {name: 香港-手动,   <<: *Anchor_HS, filter: *Anchor_HK}
  - {name: 台湾-手动,   <<: *Anchor_HS, filter: *Anchor_TW}
  - {name: 日本-手动,   <<: *Anchor_HS, filter: *Anchor_JP}
  - {name: 新加坡-手动, <<: *Anchor_HS, filter: *Anchor_SG}
  - {name: 韩国-手动,   <<: *Anchor_HS, filter: *Anchor_KR}
  - {name: 美国-手动,   <<: *Anchor_HS, filter: *Anchor_US}
  - {name: 欧洲-手动,   <<: *Anchor_HS, filter: *Anchor_EU}
  - {name: 其他-手动,   <<: *Anchor_HS, filter: *Anchor_OT}

  # ══ 自动测速组（隐藏） ══
  - {name: 香港-自动,   <<: *Anchor_UT, filter: *Anchor_HK}
  - {name: 台湾-自动,   <<: *Anchor_UT, filter: *Anchor_TW}
  - {name: 日本-自动,   <<: *Anchor_UT, filter: *Anchor_JP}
  - {name: 新加坡-自动, <<: *Anchor_UT, filter: *Anchor_SG}
  - {name: 韩国-自动,   <<: *Anchor_UT, filter: *Anchor_KR}
  - {name: 美国-自动,   <<: *Anchor_UT, filter: *Anchor_US}
  - {name: 欧洲-自动,   <<: *Anchor_UT, filter: *Anchor_EU}



